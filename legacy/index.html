<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CxinLiu - 个人主页</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23ffeaa7'/%3E%3Ccircle cx='22' cy='10' r='3.5' fill='%23e0c060'/%3E%3Ccircle cx='9' cy='18' r='2.5' fill='%23e0c060'/%3E%3Ccircle cx='20' cy='24' r='2' fill='%23e0c060'/%3E%3C/svg%3E"> 
    <style>
        :root {
            --bg-dark: #0f0c29;
            --modal-bg: rgba(20, 20, 25, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.7);
            --radius-main: 12px;
            --accent-glow: rgba(0, 210, 255, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
        img { -webkit-user-drag: none; user-select: none; }

        body {
            font-family: 'Outfit', 'Noto Sans SC', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: default;
            transition: background-color 1.5s ease;
        }

        /* --- 1. 背景层 --- */
        .background-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -5;
            background: linear-gradient(to bottom, #020105, #0f0c29, #1a1530);
            transition: filter 1.5s ease;
        }
        #starfield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -4; pointer-events: none; }

        /* --- 2. 极光层 --- */
        .aurora-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -3; pointer-events: none; overflow: hidden;
            opacity: 0.7; transition: opacity 1.5s ease;
        }
        .aurora {
            position: absolute; filter: blur(60px); opacity: 0.6;
            mix-blend-mode: color-dodge; animation: auroraWave 20s infinite alternate ease-in-out;
        }
        .aurora-1 {
            top: -20%; left: -10%; width: 120%; height: 80%;
            background: linear-gradient(135deg, transparent 20%, rgba(0, 255, 135, 0.4) 50%, rgba(96, 239, 255, 0.2) 80%, transparent 100%);
            transform: rotate(-10deg) skewX(-20deg); animation-duration: 25s;
        }
        .aurora-2 {
            top: -10%; right: -20%; width: 100%; height: 70%;
            background: linear-gradient(225deg, transparent 30%, rgba(0, 255, 180, 0.3) 50%, rgba(0, 150, 255, 0.3) 70%, transparent 100%);
            transform: rotate(15deg) skewX(20deg); animation-duration: 35s; animation-delay: -5s;
        }
        .aurora-3 {
            bottom: 0; left: 20%; width: 80%; height: 60%;
            background: radial-gradient(ellipse at center, rgba(50, 255, 150, 0.15), transparent 70%);
            filter: blur(80px); animation: auroraPulse 15s infinite alternate ease-in-out;
        }
        @keyframes auroraWave {
            0% { transform: translateX(0) rotate(-10deg) skewX(-10deg); opacity: 0.5; }
            100% { transform: translateX(30px) rotate(-8deg) skewX(-5deg); opacity: 0.7; }
        }
        @keyframes auroraPulse {
            0% { opacity: 0.1; transform: scale(1); }
            100% { opacity: 0.3; transform: scale(1.1); }
        }

        /* --- 3. 月亮 --- */
        .moon {
            position: fixed; top: 50px; right: 50px; width: 130px; height: 130px;
            border-radius: 50%; z-index: 50; cursor: pointer;
            background-color: #ffeaa7;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.4'/%3E%3C/svg%3E"),
                radial-gradient(circle at 60% 40%, rgba(160, 110, 50, 0.2) 10%, transparent 40%),
                radial-gradient(circle at 30% 65%, rgba(150, 100, 50, 0.25) 15%, transparent 45%),
                radial-gradient(circle at 75% 65%, rgba(160, 110, 50, 0.2) 8%, transparent 30%),
                radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.6) 2%, transparent 10%);
            background-blend-mode: overlay, normal, normal, normal, normal;
            box-shadow: inset -20px -20px 50px rgba(0,0,0,0.3), inset 10px 10px 30px rgba(255,255,255,0.8), 0 0 30px rgba(255, 215, 0, 0.5), 0 0 80px rgba(255, 140, 0, 0.25);
            filter: contrast(1.1) sepia(0.2); transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .moon:hover { transform: scale(1.05); }
        .moon.off {
            background-color: #2a2a2a; box-shadow: inset -20px -20px 50px rgba(0,0,0,0.8), 0 0 0 transparent; filter: grayscale(1) brightness(0.4);
        }
        
        body.lights-off .background-layer { filter: brightness(0.2); }
        body.lights-off .aurora-container { opacity: 0; }
        body.lights-off .clouds-container { opacity: 0.3; filter: brightness(0.3); }

        @media (max-width: 768px) { .moon { width: 80px; height: 80px; top: 30px; right: 20px; } }

        /* --- 4. 云层 --- */
        .clouds-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 51; pointer-events: none; overflow: hidden; transition: opacity 1.5s ease, filter 1.5s ease; }
        .cloud {
            position: absolute; top: 0; left: 0; width: 200%; height: 100%;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.012' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.8'/%3E%3C/svg%3E");
            background-size: cover;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 40%, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 40%, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
        }
        .cloud-1 { opacity: 0.15; mix-blend-mode: screen; animation: cloudMove 120s linear infinite; filter: contrast(0.8) brightness(0.8); }
        .cloud-2 { top: -20%; width: 250%; opacity: 0.1; mix-blend-mode: overlay; animation: cloudMove 90s linear infinite reverse; filter: contrast(1.2) brightness(1.1); }
        .cloud-3 { bottom: -30%; width: 220%; height: 60%; opacity: 0.15; mix-blend-mode: screen; animation: cloudMove 60s linear infinite; filter: blur(5px); }
        @keyframes cloudMove { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* --- 5. 弹幕 --- */
        .danmaku-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 20%; 
            z-index: 60; pointer-events: none; overflow: hidden;
            -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }
        .danmaku-item {
            position: absolute; left: 0; white-space: nowrap; 
            font-family: 'Noto Serif SC', serif; font-weight: 700; letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.75); text-shadow: 0 0 10px rgba(0,0,0,0.5), 0 0 20px rgba(255,255,255,0.2);
            will-change: transform; pointer-events: auto; cursor: default;
            transition: color 0.3s, opacity 0.3s, text-shadow 0.3s;
            animation: floatLeft linear forwards;
        }
        .danmaku-item:hover { color: #fff; opacity: 1 !important; text-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 20px rgba(0,210,255,0.6); z-index: 100; animation-play-state: paused; }
        @keyframes floatLeft { from { transform: translateX(100vw); } to { transform: translateX(-100%); } }

        /* --- 6. 主容器 --- */
        .container { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 20; pointer-events: none; 
        }
        .container > div {
            position: relative; width: 100%; height: 100%;
        }
        .container > div > * { 
            pointer-events: auto; 
            position: absolute; /* 初始绝对定位，JS会覆盖具体位置 */
        }

        .anim-item { opacity: 0; transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .container.loaded .anim-item { opacity: 1; }

        .avatar-wrapper {
            width: 120px; height: 120px; border-radius: 50%; padding: 3px;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5, #8E2DE2); background-size: 200% 200%;
            animation: gradientBorder 3s ease infinite, breathe 4s infinite ease-in-out;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.4);
            /* Removed margin: 0 auto 1.5rem; */
        }
        @keyframes gradientBorder { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes breathe { 0%, 100% { box-shadow: 0 0 25px rgba(0, 210, 255, 0.3); transform: scale(1); } 50% { box-shadow: 0 0 50px rgba(142, 45, 226, 0.6); transform: scale(1.02); } }
        .avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #1a1512; display: block; }

        .name {
            font-size: 3.5rem; font-weight: 800; letter-spacing: -1.5px;
            background: linear-gradient(to right, #ffffff, #89f7fe, #66a6ff, #ffffff);
            background-size: 300% auto;
            -webkit-background-clip: text; background-clip: text; color: transparent;
            text-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
            animation: textFlow 5s linear infinite;
            margin: 0; white-space: nowrap;
        }
        @keyframes textFlow { to { background-position: 300% center; } }
        
        /* Tagline */
        .tagline-container { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0; }
        .role-tag {
            font-size: 1rem; color: rgba(255, 255, 255, 0.85); font-weight: 300;
            padding: 6px 14px; border-radius: 20px; border: 1px solid transparent;
            background: rgba(255, 255, 255, 0); transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: default; letter-spacing: 1px;
        }
        .role-tag:hover {
            background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.15); color: #fff;
            transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 210, 255, 0.15);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6); backdrop-filter: blur(4px);
        }
        .role-divider { color: rgba(255, 255, 255, 0.3); font-size: 0.9rem; transform: skew(-15deg); }

        .description { font-size: 1rem; color: var(--text-sub); max-width: 400px; line-height: 1.8; font-weight: 400; margin: 0; text-align: left; }
        
        /* Tech Stack */
        .tech-stack { display: flex; justify-content: center; align-items: center; gap: 28px; flex-wrap: wrap; max-width: 300px; margin: 0; }
        .tech-item {
            position: relative; width: 42px; height: 42px; display: flex; justify-content: center; align-items: center;
            color: rgba(255, 255, 255, 0.6); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); cursor: help;
        }
        .tech-item svg { width: 100%; height: 100%; fill: currentColor; display: block; }
        .tech-item:hover { color: #fff; transform: translateY(-6px) scale(1.1); filter: drop-shadow(0 0 10px currentColor); }
        .tech-item::after {
            content: attr(data-name); position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%);
            font-size: 0.8rem; color: #fff; background: rgba(0,0,0,0.8);
            padding: 4px 8px; border-radius: 6px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
            white-space: nowrap; font-family: 'Outfit', sans-serif; letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 10;
        }
        .tech-item:hover::after { opacity: 1; }

        @media (max-width: 768px) {
            .tech-stack { gap: 12px; max-width: 250px; }
            .tech-item { width: 32px; height: 32px; }
            .tech-item::after { font-size: 0.7rem; bottom: -22px; padding: 2px 5px; }
            .danmaku-item { font-size: 0.9rem !important; }
            .tagline-container { gap: 4px; }
            .role-tag { padding: 4px 8px; font-size: 0.9rem; }
        }

        .tech-item[data-name="HTML5"]:hover { color: #E34F26; }
        .tech-item[data-name="Web"]:hover { color: #40C4FF; }
        .tech-item[data-name="React"]:hover { color: #61DAFB; }
        .tech-item[data-name="Next.js"]:hover { color: #ffffff; }
        .tech-item[data-name="Android"]:hover { color: #3DDC84; }
        .tech-item[data-name="Python"]:hover { color: #FFD43B; }
        .tech-item[data-name="C"]:hover { color: #A8B9CC; }
        .tech-item[data-name="Lua"]:hover { color: #000080; filter: drop-shadow(0 0 8px #666); } 
        .tech-item[data-name="Linux"]:hover { color: #FCC624; }
        .tech-item[data-name="Server"]:hover { color: #00E676; }
        .tech-item[data-name="PS"]:hover { color: #31A8FF; }
        .tech-item[data-name="AI"]:hover { color: #FF9A00; }

        .action-buttons { display: flex; justify-content: center; flex-wrap: wrap; gap: 1.5rem; margin: 0; }

        .btn {
            position: relative; display: flex; align-items: center; gap: 10px; padding: 12px 28px;
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-main);
            color: #e0e0e0; text-decoration: none; font-size: 0.95rem; font-weight: 600; letter-spacing: 0.5px;
            overflow: hidden; cursor: pointer; backdrop-filter: blur(10px);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn::before {
            content: ''; position: absolute; top: var(--y, -50%); left: var(--x, -50%);
            width: 150px; height: 150px;
            background: radial-gradient(circle, var(--accent-glow), transparent 60%);
            transform: translate(-50%, -50%); opacity: 0; transition: opacity 0.3s;
            pointer-events: none; z-index: 0; mix-blend-mode: screen;
        }
        .btn::after { content: ''; position: absolute; inset: 1px; border-radius: var(--radius-main); background: rgba(20, 20, 25, 0.8); z-index: 0; }
        .btn span, .btn svg { position: relative; z-index: 1; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,0.4); border-color: rgba(255,255,255,0.2); }
        .btn:hover::before { opacity: 0.8; }
        .btn:active { transform: scale(0.96); }

        /* --- 弹窗样式 --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 100; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-card {
            background: var(--modal-bg); width: 90%; max-width: 420px; 
            border-radius: 20px; padding: 2rem; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            transform: scale(0.95) translateY(20px); opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: 80vh; overflow-y: auto;
        }
        .modal-overlay.active .modal-card { transform: scale(1) translateY(0); opacity: 1; }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 0.8rem; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .modal-title { font-size: 1.4rem; font-weight: 700; color: #fff; }
        .close-btn { background: none; border: none; color: #666; cursor: pointer; padding: 4px; transition: color 0.2s;}
        .close-btn:hover { color: #fff; }

        .link-list { display: flex; flex-direction: column; gap: 12px; }
        .link-item {
            display: flex; align-items: center; padding: 14px 16px; border-radius: var(--radius-main);
            background: rgba(255, 255, 255, 0.03); color: #ccc; text-decoration: none;
            transition: all 0.2s; font-weight: 500; border: 1px solid transparent; 
            opacity: 0; transform: translateX(-20px);
        }
        .modal-overlay.active .link-item { animation: slideIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }
        .link-item:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.1); transform: translateX(4px) !important; color: #fff; }
        
        .icon-svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .btn .icon-svg { width: 18px; height: 18px; }
        .link-item .icon-svg { margin-right: 14px; opacity: 0.8; }
        .link-desc { font-size: 0.8rem; color: #666; margin-left: auto; font-family: 'Outfit', sans-serif; }

        /* Skill Grid */
        .skill-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 10px 0; }
        .skill-card { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
        .skill-name { font-size: 0.8rem; color: #ccc; font-weight: 500; }
        .skill-card .tech-item::after { display: none; }
        @media (max-width: 768px) { .skill-grid { grid-template-columns: repeat(3, 1fr); } }

        .footer { 
            position: absolute; bottom: 1.5rem; width: 100%; text-align: center; 
            font-size: 0.75rem; font-family: 'Outfit', sans-serif; letter-spacing: 0.5px; 
            opacity: 0; transition: opacity 1s 1s; color: rgba(255, 255, 255, 0.4); z-index: 20;
        }
        .container.loaded ~ .footer { opacity: 1; }
        .footer p { margin: 4px 0; }
        .icp-link { color: rgba(255, 255, 255, 0.4); text-decoration: none; transition: all 0.3s ease; position: relative; }
        .icp-link:hover { color: rgba(255, 255, 255, 0.9); text-shadow: 0 0 8px rgba(255, 255, 255, 0.3); }

        .modal-card::-webkit-scrollbar { width: 4px; }
        .modal-card::-webkit-scrollbar-track { background: transparent; }
        .modal-card::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

        /* 右键菜单 */
        #context-menu {
            position: fixed; z-index: 999; background: rgba(30, 30, 35, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 12px; padding: 8px; width: 180px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: none; opacity: 0; transform: scale(0.95); transition: opacity 0.2s, transform 0.2s; pointer-events: auto;
        }
        #context-menu.visible { display: block; opacity: 1; transform: scale(1); }
        .menu-item {
            padding: 10px 12px; color: #e0e0e0; font-size: 0.9rem; border-radius: 8px;
            cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background 0.2s, color 0.2s;
        }
        .menu-item:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .menu-item svg { width: 16px; height: 16px; opacity: 0.8; }
        .menu-divider { height: 1px; background: rgba(255, 255, 255, 0.1); margin: 6px 0; }
    </style>
</head>
<body>

    <div class="background-layer"></div>
    <canvas id="starfield"></canvas>
    <div class="aurora-container">
        <div class="aurora aurora-1"></div>
        <div class="aurora aurora-2"></div>
        <div class="aurora aurora-3"></div>
    </div>

    <div class="moon" id="moon"></div>
    <div class="clouds-container">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
    </div>

    <div id="danmaku-container" class="danmaku-container"></div>

    <div class="container" id="mainContainer">
        <div> 
            <div class="avatar-wrapper anim-item" style="transition-delay: 0ms;">
                <img src="avatar_50KB.png" alt="Avatar" class="avatar">
            </div>

            <h1 class="name anim-item" style="transition-delay: 100ms;">CxinLiu</h1>
            
            <div class="tagline-container anim-item" style="transition-delay: 200ms;">
                <span class="role-tag">业余开发者</span>
                <span class="role-divider">/</span>
                <span class="role-tag">安卓搞机玩家</span>
                <span class="role-divider">/</span>
                <span class="role-tag">平面设计师</span>
            </div>
            
            <p class="description anim-item" style="transition-delay: 300ms;">
                热爱编程与设计，专注用技术提高效率。
            </p>
            
            <div id="tech-stack-container" class="tech-stack anim-item" style="transition-delay: 300ms;"></div>

            <div class="action-buttons anim-item" id="buttonContainer" style="transition-delay: 400ms;"></div>
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2025 www.cxin.net. All rights reserved.</p>
        <p>
            <a href="https://beian.miit.gov.cn/" target="_blank" class="icp-link">
                蜀ICP备2024051667号-4
            </a>
        </p>
    </div>

    <div id="context-menu">
        <div class="menu-item" onclick="window.open(config[0].items[0].url, '_blank')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
            获取网站源码

                const availableTracks = tracks.map((val, idx) => val ? idx : -1).filter(val => val !== -1);

                const trackIndex = availableTracks[Math.floor(Math.random() * availableTracks.length)];
                
                const text = poems[Math.floor(Math.random() * poems.length)];
                const span = document.createElement('span');
                span.innerText = text;
                span.className = 'danmaku-item';
                
                const depth = Math.random(); 
                const scale = 0.8 + depth * 0.5; 
                const opacity = 0.3 + depth * 0.5; 
                const duration = 25 - depth * 10; 

                span.style.top = `${trackIndex * 15 + Math.random() * 5}%`;
                span.style.fontSize = `${scale}rem`;
                span.style.opacity = opacity;
                span.style.animationDuration = `${duration}s`;
                span.style.zIndex = Math.floor(scale * 100); 

                container.appendChild(span);

                tracks[trackIndex] = false;
                setTimeout(() => { tracks[trackIndex] = true; }, duration * 700);

                span.addEventListener('animationend', () => { span.remove(); });
            }

        function initScatterLayout() {
            const container = document.querySelector('.container > div');
            const items = Array.from(container.children);
            const isMobile = window.innerWidth < 768;
            
            const cols = isMobile ? 1 : 3;
            const rows = isMobile ? items.length : 3; 
            
            const cells = [];
            for(let r=0; r<rows; r++) {
                for(let c=0; c<cols; c++) {
                    cells.push({r, c});
                }
            }
            
            if (!isMobile) {
                cells.sort(() => Math.random() - 0.5);
            }
            
            const marginX = isMobile ? 10 : 15;
            const marginY = isMobile ? 15 : 15;
            const usableW = 100 - 2 * marginX;
            const usableH = 100 - 2 * marginY;

            const placedRects = []; // Store {left, top, right, bottom} of placed items in %

            items.forEach((item, index) => {
                if(index >= cells.length) return; 
                
                const cell = cells[index];
                const cellW = usableW / cols;
                const cellH = usableH / rows;
                
                const cx = marginX + (cell.c + 0.5) * cellW;
                const cy = marginY + (cell.r + 0.5) * cellH;
                
                let x, y, rot;
                let attempt = 0;
                let overlap = true;

                // Try to position without overlap
                while (overlap && attempt < 10) {
                    const jitterAmount = isMobile ? 0.1 : 0.3; // Reduced jitter
                    const jitterX = (Math.random() - 0.5) * (cellW * jitterAmount); 
                    const jitterY = (Math.random() - 0.5) * (cellH * jitterAmount);
                    
                    x = cx + jitterX;
                    y = cy + jitterY;

                    x = Math.max(10, Math.min(90, x));
                    y = Math.max(10, Math.min(90, y));
                    
                    // Simple collision detection based on approximate size (in %)
                    // Assuming items are roughly 20% wide and 10% high for collision check
                    const w = 20; 
                    const h = 15;
                    const rect = { l: x - w/2, r: x + w/2, t: y - h/2, b: y + h/2 };

                    overlap = false;
                    if (!isMobile) { // Only check collision on desktop where random overlap is likely
                        for (const r of placedRects) {
                            if (rect.l < r.r && rect.r > r.l && rect.t < r.b && rect.b > r.t) {
                                overlap = true;
                                break;
                            }
                        }
                    }
                    
                    if (!overlap) {
                        placedRects.push(rect);
                    }
                    attempt++;
                }

                const rotRange = isMobile ? 2 : 8; 
                rot = (Math.random() - 0.5) * rotRange * 2; 
                
                item.style.position = 'absolute';
                item.style.left = `${x}%`;
                item.style.top = `${y}%`;
                item.style.transform = `translate(-50%, -50%) rotate(${rot}deg)`;
                item.style.transition = 'all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1)';
                
                makeDraggable(item);
            });
        }

        function makeDraggable(el) {
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;
            
            const onMouseDown = (e) => {
                if(e.target.closest('a') || e.target.closest('button')) return; 
                isDragging = true;
                startX = e.clientX || e.touches[0].clientX;
                startY = e.clientY || e.touches[0].clientY;
                initialLeft = el.offsetLeft;
                initialTop = el.offsetTop;
                el.style.cursor = 'grabbing';
                el.style.transition = 'none';
                if(e.type === 'mousedown') e.preventDefault(); 
            };

            const onMouseMove = (e) => {
                if (!isDragging) return;
                const clientX = e.clientX || e.touches[0].clientX;
                const clientY = e.clientY || e.touches[0].clientY;
                const dx = clientX - startX;
                const dy = clientY - startY;
                
                // Because of transform: translate(-50%, -50%), 
                // style.left and style.top represent the CENTER coordinates of the element.
                // initialLeft (from offsetLeft) is the current center X position in pixels.
                let newCenterX = initialLeft + dx;
                let newCenterY = initialTop + dy;
                
                // Boundary Check (Pixels)
                // We want the element to stay within the window, with some margin.
                const rect = el.getBoundingClientRect();
                const halfW = rect.width / 2;
                const halfH = rect.height / 2;
                const winW = window.innerWidth;
                const winH = window.innerHeight;
                
                const safeMargin = 10; // Minimum distance from screen edge to element edge

                // Constrain Center X
                // Min Center X: halfW + safeMargin (Left edge at safeMargin)
                // Max Center X: winW - halfW - safeMargin (Right edge at winW - safeMargin)
                if (newCenterX < halfW + safeMargin) newCenterX = halfW + safeMargin;
                if (newCenterX > winW - halfW - safeMargin) newCenterX = winW - halfW - safeMargin;

                // Constrain Center Y
                if (newCenterY < halfH + safeMargin) newCenterY = halfH + safeMargin;
                if (newCenterY > winH - halfH - safeMargin) newCenterY = winH - halfH - safeMargin;

                el.style.left = `${newCenterX}px`;
                el.style.top = `${newCenterY}px`;
                
                if(e.type === 'touchmove') e.preventDefault();
            };

            const onMouseUp = () => {
                if(isDragging) {
                    isDragging = false;
                    el.style.cursor = 'grab';
                    el.style.transition = 'all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1)';
                }
            };

            el.addEventListener('mousedown', onMouseDown);
            el.addEventListener('touchstart', onMouseDown, {passive: false});
            
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('touchmove', onMouseMove, {passive: false});
            
            window.addEventListener('mouseup', onMouseUp);
            window.addEventListener('touchend', onMouseUp);
            
            el.style.cursor = 'grab';
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderTechStack();
            renderContent();
            initDanmaku();
            initScatterLayout(); // Call the new function
            
            const moon = document.getElementById('moon');
            moon.addEventListener('click', function() {
                this.classList.toggle('off');
                document.body.classList.toggle('lights-off');
            });

            const contextMenu = document.getElementById('context-menu');
            document.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                let x = e.clientX;
                let y = e.clientY;
                if (x + 180 > window.innerWidth) x -= 180;
                if (y + 120 > window.innerHeight) y -= 120;
                contextMenu.style.left = `${x}px`;
                contextMenu.style.top = `${y}px`;
                contextMenu.classList.add('visible');
            });
            document.addEventListener('click', () => { contextMenu.classList.remove('visible'); });

            setTimeout(() => { document.getElementById('mainContainer').classList.add('loaded'); }, 100);
        });

        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let width, height, stars = [], meteors = [];

        class Star3D {
            constructor() {
                this.x = (Math.random() - 0.5) * width * 2; 
                this.y = (Math.random() - 0.5) * height * 2;
                this.z = Math.random() * width; 
                this.pz = this.z;
            }

            update() {
                this.z -= 0.5; 
                if (this.z <= 0) {
                    this.z = width;
                    this.x = (Math.random() - 0.5) * width * 2;
                    this.y = (Math.random() - 0.5) * height * 2;
                    this.pz = this.z;
                }
            }

            draw() {
                const sx = (this.x / this.z) * width/2 + width/2;
                const sy = (this.y / this.z) * height/2 + height/2;
                const r = (1 - this.z / width) * 1.5;
                const opacity = (1 - this.z / width);

                if (sx > 0 && sx < width && sy > 0 && sy < height) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                    ctx.beginPath();
                    ctx.arc(sx, sy, r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        class Meteor {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width + 300; this.y = -100;
                this.size = Math.random() * 2 + 1; this.speed = Math.random() * 10 + 10;
                this.angle = Math.PI / 4; this.life = 0; this.maxLife = 100;
            }
            update() {
                this.x -= this.speed * Math.cos(this.angle); this.y += this.speed * Math.sin(this.angle);
                this.life++;
                if (this.x < -100 || this.y > height + 100 || this.life > this.maxLife) {
                    this.reset(); this.x = Math.random() * width * 1.5; this.y = Math.random() * -height;
                }
            }
            draw() {
                const tail = 150;
                const grad = ctx.createLinearGradient(this.x, this.y, this.x + tail * Math.cos(this.angle), this.y - tail * Math.sin(this.angle));
                grad.addColorStop(0, 'white'); grad.addColorStop(0.4, 'rgba(0, 210, 255, 0.4)'); grad.addColorStop(1, 'transparent');
                ctx.strokeStyle = grad; ctx.lineWidth = this.size; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x + tail * Math.cos(this.angle), this.y - tail * Math.sin(this.angle)); ctx.stroke();
            }
        }
        function initCanvas() {
            width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height;
            stars = Array(800).fill().map(() => new Star3D());
            meteors = [new Meteor(), new Meteor()]; meteors[1].y = -5000;
        }
        function animate() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(s => { s.update(); s.draw(); });
            meteors.forEach(m => { m.update(); m.draw(); });
            requestAnimationFrame(animate);
        }
        window.addEventListener('resize', initCanvas);
        initCanvas(); animate();
    </script>
</body>
</html>
